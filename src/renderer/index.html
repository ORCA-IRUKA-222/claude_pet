<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data:; style-src 'self'; script-src 'self'"
    />
    <title>Claude Pet</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root">
      <section id="panel" hidden>
        <header class="panel-header">
          <nav class="tabs" role="tablist">
            <button type="button" class="tab" data-tab="sessions" role="tab">
              <span data-i18n="ui.sessions"></span>
              <span class="tab-count" id="sessions-count"></span>
            </button>
            <button type="button" class="tab" data-tab="chat" role="tab" data-i18n-title="ui.quickChat">
              <span data-i18n="ui.tab.chat"></span>
            </button>
            <button type="button" class="tab" data-tab="timer" role="tab">
              <span data-i18n="ui.tab.timer"></span>
              <span class="tab-dot" id="timer-dot" hidden></span>
            </button>
            <button type="button" class="tab" data-tab="memo" role="tab">
              <span data-i18n="ui.tab.memo"></span>
            </button>
            <button type="button" class="tab" data-tab="calendar" role="tab">
              <span data-i18n="ui.tab.calendar"></span>
            </button>
          </nav>
          <button type="button" class="icon-button" id="panel-close" aria-label="close">✕</button>
        </header>

        <div class="tab-body" id="tab-sessions">
          <div class="toolbar">
            <button type="button" class="text-button" id="new-chat" data-i18n="ui.newChat"></button>
            <span class="spacer"></span>
            <button type="button" class="text-button" id="mark-all" data-i18n="ui.markAllRead"></button>
          </div>
          <ul class="session-list" id="session-list"></ul>
          <p class="empty" id="sessions-empty" data-i18n="ui.noSessions"></p>
          <p class="hint" id="setup-hint" data-i18n="ui.setupHint" hidden></p>
        </div>

        <div class="tab-body" id="tab-chat" hidden>
          <div class="chat-log" id="chat-log"></div>
          <div class="toolbar">
            <button type="button" class="text-button" id="chat-new" data-i18n="ui.newChat"></button>
            <span class="spacer"></span>
            <button type="button" class="text-button" id="chat-stop" data-i18n="ui.stop" hidden></button>
            <button
              type="button"
              class="text-button"
              id="chat-memo"
              data-i18n="ui.saveMemoShort"
              data-i18n-title="ui.saveMemo"
            ></button>
            <button type="button" class="text-button" id="chat-copy" data-i18n="ui.copy"></button>
            <button type="button" class="text-button" id="chat-app" data-i18n="ui.openInAppShort"></button>
            <button type="button" class="text-button" id="chat-terminal" data-i18n="ui.continueInTerminal"></button>
          </div>
        </div>

        <div class="tab-body tool-tab" id="tab-tools" hidden></div>
      </section>

      <div id="bubble" class="bubble" hidden>
        <span class="dot"></span>
        <div class="bubble-lines">
          <div class="bubble-head">
            <div class="bubble-title" id="bubble-title"></div>
            <span class="bubble-clock" id="bubble-clock" hidden></span>
            <button type="button" class="bubble-icon pause-icon" id="bubble-pause" hidden></button>
          </div>
          <div class="bubble-sub" id="bubble-sub"></div>
          <div class="bubble-actions" id="bubble-actions" hidden></div>
          <div class="progress bubble-progress" id="bubble-progress" hidden>
            <div class="progress-fill" id="bubble-progress-fill"></div>
          </div>
        </div>
      </div>

      <div id="stage" class="stage">
        <div id="sprite" class="sprite" aria-label="pet"></div>
        <span id="badge" class="badge" hidden></span>
        <span id="mood" class="mood" hidden></span>
      </div>

      <div id="mini" class="mini" hidden>
        <span class="dot"></span>
        <span class="mini-mood" id="mini-mood" hidden></span>
        <span class="mini-label" id="mini-label"></span>
        <span class="badge mini-badge" id="mini-badge" hidden></span>
      </div>

      <form id="composer" class="composer" hidden>
        <div id="composer-notice" class="composer-notice" hidden></div>
        <div id="composer-files" class="composer-files" hidden></div>
        <div id="composer-repos" class="composer-repos" hidden></div>
        <textarea id="composer-input" rows="2" spellcheck="false"></textarea>
        <div class="composer-row">
          <button type="button" class="icon-button" id="composer-attach">📎</button>
          <button type="button" class="text-button folder" id="composer-cwd"></button>
          <select id="composer-target" class="target">
            <option value="local" data-i18n="ui.target.local"></option>
            <option value="cloud" data-i18n="ui.target.cloud"></option>
            <option value="chat" data-i18n="ui.target.chat"></option>
          </select>
          <span class="spacer"></span>
          <button type="button" class="text-button" id="composer-close" data-i18n="ui.close"></button>
          <button type="submit" class="send" id="composer-send">↵</button>
        </div>
      </form>
    </div>

    <script src="../shared/atlas.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/time.js"></script>
    <script src="../shared/lines.js"></script>
    <script src="sprite.js"></script>
    <script src="markdown.js"></script>
    <script src="tools.js"></script>
    <script src="app.js"></script>
  </body>
</html>
